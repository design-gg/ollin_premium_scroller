<!DOCTYPE html>
<html lang="en" style="height: 100%;">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="ad.size" content="width=1080,height=1920">
	<title>ollin premium scroller</title>

	<style>
		
		* {
			box-sizing: border-box;
		}
		button {
			padding: 0;
			border: 0;
			appearance: none;
			background: none;
			cursor: pointer;
		}
		.nowrap {
			white-space: nowrap;
		}
		.ollincd {
			text-decoration: none;
		}
		.ollincd-inner {
			height: 1920px;
			width: 1080px;
			margin-inline: auto;			
			display: flex;
			align-items: center;
			position: relative;
			background-color: #EE3C71;
			z-index: 0;
			overflow: hidden;
		}
		.ollincd-logo {
			filter: blur(50px);
			align-self: flex-start;
			aspect-ratio: 215 / 76;	
			width: 645px;
			/* height: 228px; */
			margin-top: 236px;
			margin-inline: auto;
			img {
				width: 100%;
				height: 100%;
			}
		}
		.ollincd-bg,
		.ollincd-girl {
			position: absolute;
			inset: 0;
			background-position: center;
			background-repeat: no-repeat;
			z-index: -1;
			scale: 1;
		}
		
		.ollincd-bg {			
			background-image: url("img/bg.webp");
			translate: 0 0;
		}		
		.ollincd-girl {
			background-image: url("img/girl.webp");
			translate: 0 500px;
		}
		

		
	</style>

</head>
<body style="margin: 0; display: flex; flex-direction: column; min-height: 100%;">
	<!--<div style="height: 100vh;"></div>-->
	

	<!-- banner START -->
	<a href="" class="ollincd "  id="click-url">
		<div class="ollincd-inner" id="inner">
			<div class="ollincd-logo">
				<img src="img/logo.svg" alt="OLLIN professional логотип" />
			</div>				
			<div class="ollincd-bg"></div>
			<div class="ollincd-girl"></div>
		</div>
	</a>
	<!-- banner END -->


	<div style="height: 100vh;"></div>


	<script>
		(() => {
		const target = document.querySelector('#inner');
		if (!target) return;

		let prev = 0;
		function measure() {
			const h = target.offsetHeight;
			if (h > 0 && h !== prev) {
			prev = h;
			parent.postMessage({ type: 'premiumbar-resize', height: h }, '*');
			}
		}
		new ResizeObserver(() => { measure(); }).observe(target);
		measure();

		window.addEventListener('message', (e) => {
			if (!e.data || typeof e.data.type !== 'string') return;
			if (e.data.type === 'set-click-url') {
			const a = document.querySelector('#click-url');
			if (!a) return;
			a.href = e.data.url;
			if (e.data.target) a.target = e.data.target;
			if (e.data.rel) a.rel = e.data.rel;
			}
		});
		})();
	</script>		

</body>
<script src="gsap.min.js"></script>
<script src="ScrollTrigger.min.js"></script>
<script src="index.js"></script>
</html>
